<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ricoman · Purchasing Bot</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#0a0e1a; --bg2:#0f1525; --surface:#161d31; --surface2:#1c2440;
  --line:#283251; --line2:#384469;
  --ink:#eef2fb; --muted:#aeb9d6; --faint:#8b97ba;
  --accent:#7c83ff; --accent2:#22d3ee; --violet:#a855f7;
  --gold:#f7c948; --green:#34d399; --red:#fb7185;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:
  radial-gradient(1200px 600px at 80% -10%, rgba(124,131,255,.12), transparent 60%),
  radial-gradient(1000px 500px at -10% 10%, rgba(34,211,238,.08), transparent 55%),
  var(--bg);
  color:var(--ink);line-height:1.5;min-height:100vh}
a{color:var(--accent)}
button{font-family:inherit;color:inherit}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  background:rgba(10,14,26,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 18px}
.brand{font-weight:800;font-size:17px;letter-spacing:.3px;display:flex;align-items:center;gap:9px}
.brand .dot{width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.brand .sep{padding-left:9px;border-left:1px solid var(--line)}
.brand small{font-weight:600;color:var(--faint);font-size:12px}
.modepill{font-size:11px;font-weight:800;letter-spacing:.4px;border-radius:999px;padding:4px 10px;text-transform:uppercase}
.modepill.demo{background:rgba(247,201,72,.16);color:var(--gold)}
.modepill.live{background:rgba(52,211,153,.16);color:var(--green)}

/* layout: left-hand Purchasing Section nav + main */
.shell{display:grid;grid-template-columns:232px 1fr;gap:0;min-height:calc(100vh - 53px)}
.side{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto}
.side h3{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);margin:6px 8px 10px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;
  color:var(--muted);border-radius:10px;padding:10px 11px;font-size:14px;font-weight:600;cursor:pointer}
.nav button:hover{background:var(--surface);color:var(--ink)}
.nav button.active{background:linear-gradient(135deg,rgba(124,131,255,.18),rgba(34,211,238,.10));color:var(--ink)}
.nav button .ic{width:20px;text-align:center;font-size:15px}
.nav button .badge{margin-left:auto;font-size:11px;font-weight:800;background:var(--accent);color:#0a0e1a;
  border-radius:999px;padding:1px 7px;min-width:18px;text-align:center}
.nav .phase{font-size:10px;color:var(--faint);margin-left:auto;font-weight:700}
.side .foot{margin-top:18px;padding:10px 8px;font-size:11px;color:var(--faint);border-top:1px solid var(--line)}
main{padding:22px 24px 90px;max-width:1080px}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav button{width:auto}
}

h1{font-size:25px;margin:2px 0 4px;letter-spacing:-.3px}
h2{font-size:16px;margin:0 0 12px;letter-spacing:.2px}
.sub{color:var(--muted);margin:0 0 20px;max-width:720px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .green{color:var(--green)} .red{color:var(--red)} .gold{color:var(--gold)}
.card{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);
  border-radius:16px;padding:18px;margin-bottom:16px}
.card h2 .count{color:var(--faint);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:6px 0 4px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:24px;font-weight:800;margin-top:4px}

button.btn{border:0;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:800;cursor:pointer;
  color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 8px 22px -10px rgba(124,131,255,.7)}
button.btn:active{transform:translateY(1px)}
button.btn.sm{padding:8px 12px;font-size:13px}
button.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;
  padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer}
button.ghost:hover{border-color:var(--line2)}
button.ghost.sm{padding:6px 10px;font-size:12px}
button.ok{border:1px solid rgba(52,211,153,.4);background:rgba(52,211,153,.12);color:#6ee7b7}
button.danger{border:1px solid rgba(251,113,133,.35);background:rgba(251,113,133,.1);color:#fda4af}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--faint);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;
  padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;padding:2px 8px;border-radius:999px}
.tag.flag{background:rgba(251,113,133,.15);color:#fda4af}
.tag.ok{background:rgba(52,211,153,.15);color:#6ee7b7}
.tag.warn{background:rgba(247,201,72,.16);color:var(--gold)}
.tag.info{background:rgba(124,131,255,.16);color:var(--accent)}
.tag.parked{background:rgba(139,151,186,.18);color:var(--muted)}
.tag.placed{background:rgba(52,211,153,.15);color:#6ee7b7}

label.field{display:block;margin:0 0 12px}
label.field .lab{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px;display:block}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  color:var(--ink);padding:10px 12px;font-size:14px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent)}
textarea{min-height:150px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.grid2{grid-template-columns:1fr}}

.po{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;background:var(--surface)}
.po .po-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.carriage{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:13px}
.carriage.warn{background:rgba(247,201,72,.1);border:1px solid rgba(247,201,72,.3)}
.carriage.ok{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.25);color:#9ff0cf}
.empty{text-align:center;color:var(--faint);padding:34px 10px}
.empty .ic{font-size:30px;opacity:.7}
.note{white-space:pre-wrap}
.bar{height:7px;background:#0c1222;border-radius:99px;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--surface2);
  border:1px solid var(--line2);border-radius:12px;padding:12px 18px;font-weight:700;font-size:14px;z-index:50;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.6);opacity:0;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast.err{border-color:rgba(251,113,133,.5);color:#fda4af}
.phasebar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.phasebar .p{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--faint)}
.phasebar .p b{color:var(--ink)}
.phasebar .p.done{border-color:rgba(52,211,153,.35);color:#6ee7b7}
.phasebar .p.now{border-color:var(--accent);color:var(--accent);background:rgba(124,131,255,.1)}
.hint{font-size:12.5px;color:var(--faint);margin-top:6px}
.inline-edit{display:inline-block;width:90px}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <span class="dot"></span> Ricoman <small>· Ricobot</small>
    <span class="sep"></span><small>Purchasing Bot</small>
  </div>
  <span id="mode-pill" class="modepill demo">Demo</span>
</div>

<div class="shell">
  <aside class="side">
    <h3>Purchasing Section</h3>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      Replenishment &amp; pricing module for Ricobot.<br>
      Drafts-first — nothing writes to Unleashed without sign-off.
    </div>
  </aside>
  <main id="view"><!-- rendered by app.js --></main>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
