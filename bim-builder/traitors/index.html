<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b09">
<title>The Traitors Castle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap">
<style>
/* Layout: one candlelit column per phone, a status bar on top, game master controls docked at the bottom, a cinematic overlay for big moments */
:root{--bg:#0d0b09;--panel:#17130e;--panel2:#1f1912;--line:#3b301f;--gold:#c9a45c;--gold-l:#e7c983;--gold-d:#7d6534;--cream:#efe6d2;--muted:#a99a80;--blood:#8e1c1c;--blood-l:#e29a92;--steel:#9fb3c4;
 --display:"Cinzel","Trajan Pro",Georgia,serif;--body:"Cormorant Garamond",Garamond,Georgia,serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--cream);font-family:var(--body);font-size:17px;line-height:1.38;-webkit-tap-highlight-color:transparent;
 padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(130px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:radial-gradient(ellipse 110% 55% at 50% -5%,rgba(201,164,92,.18),transparent 60%),radial-gradient(ellipse 80% 50% at 50% 110%,rgba(142,28,28,.16),transparent 60%);animation:breathe 7s ease-in-out infinite}
body.night::after{background:radial-gradient(ellipse 100% 60% at 50% 0%,rgba(60,70,110,.25),transparent 60%),radial-gradient(ellipse 80% 50% at 50% 110%,rgba(142,28,28,.25),transparent 60%)}
@keyframes breathe{50%{opacity:.7}}
#wrap{max-width:540px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold-l)}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:8px;padding-block:7px 5px;background:linear-gradient(var(--bg) 80%,transparent);margin-bottom:4px}
#bar .rl{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#bar .rl .t{font-family:var(--display);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--gold-d);padding:4px 9px;font-family:var(--display);font-size:11px;letter-spacing:.08em;background:var(--panel);border-radius:20px;white-space:nowrap}
.pill b{color:var(--gold-l);font-size:14px;font-variant-numeric:tabular-nums}
.pill.sec{border-color:#6a2420;color:var(--blood-l)}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin:0}
.red{color:var(--blood-l)!important}
.rule{display:flex;align-items:center;justify-content:center;margin:6px auto;width:170px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-d),transparent)}
.rule i{width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.hd{text-align:center;padding-block:8px 2px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,6vw,27px);letter-spacing:.06em;line-height:1.15;margin:0;text-wrap:balance;text-transform:uppercase}
.mega{font-family:var(--display);font-weight:900;font-size:clamp(36px,11vw,56px);letter-spacing:.08em;line-height:1;margin:0;text-transform:uppercase;
 background:linear-gradient(180deg,#f7e3ad,#c9a45c 55%,#7d6534);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(201,164,92,.25))}
.lede{font-size:18px;margin:8px 0}
.small{font-size:14.5px;color:var(--muted);margin:6px 0}
.center{text-align:center}
.sect{font-family:var(--display);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px;font-weight:500}
.stack{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.stack.t{gap:6px;margin:8px 0}
.btn{display:flex;justify-content:center;align-items:center;gap:10px;width:100%;padding:12px 14px;border:1px solid var(--gold);background:linear-gradient(#dcbb72,#a9853f);color:#1b1307;font-family:var(--display);font-weight:700;letter-spacing:.08em;font-size:15px;border-radius:3px;text-transform:uppercase;text-decoration:none;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.big{padding:15px;font-size:15px}
.btn.sm{padding:9px 12px;font-size:12px;width:auto}
.btn.ghost{background:transparent;color:var(--cream);border-color:var(--gold-d)}
.btn.blood{background:linear-gradient(#a52a24,#7a1414);border-color:#c0453c;color:#fbe9e6}
.btn.wa{background:#1f7a46;border-color:#2fa463;color:#eafff2}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.pick{text-transform:none;font-family:var(--body);font-size:18px;padding:10px 14px;font-weight:700;letter-spacing:0}
.btn.pick.on{border-color:var(--gold-l);background:#3a2c14;color:var(--gold-l)}
.link{display:block;margin:16px auto;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:16px}
.txt{width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--cream);font:inherit;font-size:20px;padding:12px 14px;border-radius:3px}
.txt.code{font-family:var(--display);font-size:30px;letter-spacing:.35em;text-align:center;text-transform:uppercase}
textarea.txt{min-height:150px;resize:vertical}
.row{display:flex;gap:8px;align-items:stretch}.row>*{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);padding:12px 14px;margin:10px 0;border-radius:3px}
.panel>:first-child{margin-top:0}.panel>:last-child{margin-bottom:0}
.card{margin:8px 0;padding:12px 14px;border:1px solid var(--gold-d);background:linear-gradient(180deg,#1b150d,#110e0a);outline:1px solid var(--line);outline-offset:-6px;border-radius:2px}
.card.steel{border-color:#55687a}.card.steel .eyebrow{color:var(--steel)}
.card h2{font-family:var(--display);font-size:18px;letter-spacing:.06em;text-transform:uppercase;margin:2px 0 4px}
.card p{margin:4px 0;font-size:15px;line-height:1.35}
.card .how{display:none}.card.open .how{display:block}.card .tog{background:none;border:0;color:var(--gold-l);font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:4px 0;cursor:pointer}
.pot{font-size:14px;color:var(--gold-l);font-style:italic}
.advs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.adv{background:var(--panel);border:1px solid var(--line);padding:7px 4px;border-radius:3px;display:flex;flex-direction:column;align-items:center;gap:2px}
.adv b{font-family:var(--display);color:var(--gold);font-size:16px}.adv span{font-size:13.5px;line-height:1.1;text-align:center}
.adv.on,.seg .on{border-color:var(--gold);background:#2b2112}
.seg{display:flex;margin:8px 0}.seg button{flex:1;padding:12px;background:var(--panel);border:1px solid var(--line);font-family:var(--display);font-size:13px;letter-spacing:.06em}
.err{color:var(--blood-l);margin:6px 0}
.notice{border-left:3px solid var(--blood);padding:8px 12px;background:#1d0f0d;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;font-size:15px;border:1px solid var(--line);background:var(--panel);border-radius:20px;font-size:16px}
.chip.ok{border-color:var(--gold-d);color:var(--gold-l)}
.chip.off{opacity:.5}
.chip .d{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.ok .d{background:var(--gold)}
.chip.sil{text-decoration:line-through;color:var(--blood-l)}
.cd{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums;color:var(--gold-l);text-align:center;margin:6px 0}
.cd.hot{color:var(--blood-l);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.hold{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;min-height:96px;border:1px dashed var(--gold-d);background:var(--panel);border-radius:3px;margin:10px 0}
.hold .cv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:12px;font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.hold .in{visibility:hidden;padding:18px;text-align:center}
.hold.show .in{visibility:visible}.hold.show .cv{visibility:hidden}.hold.show{border-style:solid;background:#1d1610}
.role{font-family:var(--display);font-size:clamp(26px,8vw,38px);font-weight:900;letter-spacing:.1em;margin:6px 0;text-transform:uppercase}
.flip{perspective:1200px;margin:8px auto;width:min(230px,62vw);aspect-ratio:5/7}
.flip .fi{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--gold);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow:hidden;text-align:center;
 background:radial-gradient(circle at 50% 35%,#2a2011,#100c08 70%);box-shadow:inset 0 0 0 6px #100c08,inset 0 0 0 7px var(--gold-d),0 20px 50px rgba(0,0,0,.6)}
.flip .fb{transform:rotateY(180deg)}
.flip .fb.t{background:radial-gradient(circle at 50% 35%,#4a1210,#140707 70%);border-color:#c0453c}
.seal{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#b53a2e,#6e1010 70%);box-shadow:0 0 0 6px #4a0a0a,0 8px 24px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:40px;color:#f0c6bd;margin:14px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.nums button{aspect-ratio:1;max-height:62px;background:var(--panel);border:1px solid var(--gold-d);font-family:var(--display);font-size:22px;border-radius:3px}
.nums button.on{background:#3a2c14;border-color:var(--gold-l);color:var(--gold-l)}
.hand{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.pc{width:64px;height:90px;border-radius:6px;background:linear-gradient(160deg,#f3ead5,#d8c9a6);color:#2a1d0c;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:28px;box-shadow:0 6px 16px rgba(0,0,0,.5);border:2px solid #fff6e0}
.pc.top{width:84px;height:118px;font-size:42px}
.pc.bad{background:linear-gradient(160deg,#e4b0a8,#b46a60)}
.pc.new{animation:deal .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes deal{from{transform:translateY(-60px) rotate(-12deg) scale(.6);opacity:0}}
.tapbtn{width:170px;height:170px;border-radius:50%;margin:16px auto;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:34px;letter-spacing:.1em;
 background:radial-gradient(circle at 40% 35%,#e6c47c,#8c6a2c);border:3px solid #f2dca0;color:#241606;box-shadow:0 0 40px rgba(201,164,92,.35)}
.tapbtn:disabled{filter:grayscale(.8);opacity:.5}
.flash{animation:redflash .8s}
@keyframes redflash{0%{background:#7a1414}100%{background:transparent}}
.words{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.words span{background:var(--panel2);border:1px solid var(--line);padding:8px 4px;text-align:center;font-size:17px;font-weight:700;animation:fadein .4s both}
@keyframes fadein{from{opacity:0;transform:scale(.9)}}
.rid{padding:7px 10px;border:1px solid var(--line);background:var(--panel);margin:5px 0}
.rid .txt{padding:7px 10px;font-size:16px}
.rid.ok{border-color:var(--gold-d)}
.rid p{margin:0 0 5px;font-size:15px;line-height:1.3}
.feed{font-size:16px;color:var(--muted);margin:4px 0}
canvas{display:block;max-width:100%;margin:8px auto;border-radius:6px;border:1px solid var(--gold-d)}
canvas#cv{max-width:min(300px,calc(100vh - 500px))}
.vrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:3px 10px;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:3px}
.vrow .ar{color:var(--muted);font-style:italic;font-size:16px}
.vrow b{font-family:var(--display);font-size:17px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.vrow.new{animation:flipin .7s cubic-bezier(.2,.8,.2,1)}
@keyframes flipin{from{transform:perspective(600px) rotateX(-90deg);opacity:0}}
.vrow.fin{border-color:var(--gold)}
.vrow .full{flex-basis:100%;font-size:15px;color:var(--muted)}
.tally{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin:14px 0}
.tally .bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.tally .bar i{display:block;height:100%;background:linear-gradient(90deg,#7a1414,#e29a92);transition:width .8s}
.toggle{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--blood);background:#1d0f0d;margin:10px 0}
.toggle input{width:22px;height:22px;accent-color:var(--blood)}
.scene{text-align:center;padding:16px 14px;margin:10px 0;border:1px solid #2b2f45;background:radial-gradient(circle at 50% 20%,#1c2036,#09090f 70%);border-radius:4px;overflow:hidden;position:relative}
.moon{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;background:radial-gradient(circle at 35% 35%,#f4efe0,#bdb6a0);box-shadow:0 0 50px rgba(240,235,210,.35)}
.candle{width:22px;height:70px;margin:18px auto 0;background:linear-gradient(90deg,#d9cba8,#f4ead2,#cbbb94);border-radius:3px;position:relative;border:0;display:block}
.candle::before{content:"";position:absolute;left:50%;top:-30px;width:16px;height:28px;margin-left:-8px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
 background:radial-gradient(circle at 50% 70%,#fff6c8,#ffb43b 45%,rgba(255,90,20,.0) 75%);animation:flick .18s infinite alternate;filter:blur(.4px)}
.candle.out::before{animation:none;opacity:0}
@keyframes flick{to{transform:scale(.92,1.06) translateX(1px)}}
.scene.blood{border-color:#4a1a17;background:radial-gradient(circle at 50% 30%,#3a0d0d,#0d0606 70%)}
.coinrow{display:flex;justify-content:center;align-items:baseline;gap:10px;margin:10px 0}
.bigg{font-family:var(--display);font-weight:900;font-size:72px;color:var(--gold-l);line-height:1}
#gm{position:fixed;left:0;right:0;bottom:0;z-index:9;background:linear-gradient(transparent,var(--bg) 18%);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#gm .in{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.gmrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gmrow .lab{flex:1}
.gmend{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:14px;white-space:nowrap}
.gmend.arm{border-color:#c0453c;color:var(--blood-l);background:#3a1414}
#gm .lab{font-family:var(--display);font-size:11px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;text-align:center}
#gm .chips{justify-content:center;margin:0}
#gm .chip{cursor:pointer}
#net{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;background:#3a1414;border:1px solid #c0453c;color:#fbe9e6;padding:6px 14px;border-radius:20px;font-size:15px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(5,4,3,.94);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
#sheet .in{max-width:540px;margin:0 auto}
/* cinematic overlay */
#fx{position:fixed;inset:0;z-index:30;pointer-events:none;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;overflow:hidden}
#fx.on{pointer-events:auto}
#fx .bg{position:absolute;inset:0;background:#050303;animation:bgin .5s both}
#fx.out{animation:fxout .8s forwards}
@keyframes bgin{from{opacity:0}}
@keyframes fxout{to{opacity:0}}
#fx .ct{position:relative;z-index:2}
#fx .nm{font-family:var(--display);font-weight:900;font-size:clamp(38px,12vw,64px);letter-spacing:.06em;text-transform:uppercase;line-height:1.05;position:relative;display:inline-block}
#fx .cap{font-family:var(--display);letter-spacing:.3em;font-size:14px;text-transform:uppercase;color:var(--gold);margin:12px 0}
.dagger{position:absolute;left:50%;top:-40%;width:90px;margin-left:-45px;z-index:3;animation:stab 1.1s cubic-bezier(.6,0,.9,.4) .4s forwards;filter:drop-shadow(0 10px 20px rgba(0,0,0,.8))}
@keyframes stab{to{top:22%;transform:rotate(4deg)}}
.splat{position:absolute;left:50%;top:50%;width:10px;height:10px;z-index:1}
.splat i{position:absolute;border-radius:50%;background:#8e1010;transform:scale(0);animation:splat .5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes splat{to{transform:scale(1)}}
.strike{position:absolute;left:-6%;top:52%;height:6px;width:0;background:#c3241c;animation:strike .5s ease-out 2.2s forwards;transform:rotate(-4deg);box-shadow:0 0 12px #c3241c}
@keyframes strike{to{width:112%}}
.stamp{display:inline-block;border:3px solid #c3241c;color:#e04a40;font-family:var(--display);font-weight:900;letter-spacing:.2em;padding:6px 14px;font-size:22px;transform:rotate(-8deg) scale(2);opacity:0;animation:stamp .35s ease-in 2.6s forwards;margin-top:18px}
@keyframes stamp{to{transform:rotate(-8deg) scale(1);opacity:1}}
.nmin{opacity:0;animation:nmin .8s ease-out 1.5s forwards}
@keyframes nmin{from{opacity:0;letter-spacing:.5em;filter:blur(8px)}to{opacity:1}}
.smoke span{display:inline-block;animation:smoke 2.2s ease-in 1.6s forwards}
@keyframes smoke{to{opacity:0;filter:blur(14px);transform:translateY(-60px) scale(1.4)}}
.shieldsvg{width:150px;animation:shieldin .7s cubic-bezier(.2,1.5,.4,1) 1s both;filter:drop-shadow(0 0 30px rgba(159,179,196,.6))}
@keyframes shieldin{from{transform:scale(0) rotate(-30deg)}}
.rays{position:absolute;inset:-50%;background:repeating-conic-gradient(rgba(231,201,131,.12) 0 6deg,transparent 6deg 18deg);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dawn{position:absolute;inset:0;background:linear-gradient(0deg,#e8955b 0%,#7a4a6b 35%,#1a1630 75%);animation:dawn 3s ease-out both}
@keyframes dawn{from{filter:brightness(.1)}}
.sun{position:absolute;left:50%;bottom:-120px;width:220px;height:220px;margin-left:-110px;border-radius:50%;background:radial-gradient(circle,#fff1c4,#ffb057 60%,transparent 70%);animation:rise 3s ease-out both}
@keyframes rise{from{transform:translateY(120px)}}
.coin{position:absolute;top:-40px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2c0,#d4a849 50%,#8a6420);border:1px solid #f4dc98;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
.glitch{animation:glitch .25s steps(2) 6}
@keyframes glitch{50%{transform:translateX(-4px);text-shadow:4px 0 #c3241c,-4px 0 #3b5cff}}
.redpulse{position:absolute;inset:0;background:radial-gradient(circle,rgba(160,20,20,.55),transparent 70%);animation:pulse 1.2s infinite}
.lockbar{position:relative;height:30px;background:var(--panel);border:1px solid var(--gold-d);margin:16px 0;border-radius:15px;overflow:hidden}
.lockbar.miss{background:#5a1a1a;border-color:#c0453c}
.lockbar .zone{position:absolute;top:0;bottom:0;width:18%;background:rgba(201,164,92,.4)}
.lockbar .pin{position:absolute;top:3px;width:6px;height:24px;margin-left:-3px;background:var(--gold-l);border-radius:3px;box-shadow:0 0 8px var(--gold)}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px auto;max-width:min(340px,calc((100vh - 470px) * 1.1))}
.pcard{aspect-ratio:3/4;background:radial-gradient(circle at 50% 35%,#2a2011,#100c08 70%);border:1px solid var(--gold-d);border-radius:6px;font-size:34px;color:var(--gold-l)}
.pcard.up{background:linear-gradient(160deg,#f3ead5,#d8c9a6);color:#7a1414;border-color:#fff6e0}
.arrows{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.arrows button{aspect-ratio:1;font-size:36px;background:var(--panel);border:1px solid var(--gold-d);border-radius:6px;color:var(--gold-l)}
.shade{display:grid;gap:6px;margin:12px 0}

/* ---------- game engine (runs on the host phone) ---------- */
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const median=a=>{const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2)};
const now=()=>Date.now();

const SV={G:null,send:null,save:null,
 P(id){return this.G.players.find(p=>p.id===id)},
 R(){return ADV[this.G.adv].rounds[this.G.round]},
 ids(){return this.G.players.map(p=>p.id)},
 traitors(){return this.G.players.filter(p=>p.role==="T").map(p=>p.id)},

 create(code,name,token){
  this.G={code,phase:"lobby",ph:{},seq:0,adv:0,nT:1,round:0,pot:0,votes:[],murders:[],silenced:null,deck:[],
   players:[{id:"p0",name:name.slice(0,16),token,host:true,gold:8,inv:{S:0,D:0},conn:true}],nid:1};
  this.commit();
 },
 join(token,name){
  const G=this.G;let p=G.players.find(x=>x.token===token);
  if(!p&&G.phase!=="lobby"){const nm=String(name||"").trim().toLowerCase();const c=G.players.filter(x=>!x.host&&!x.bot&&x.name.toLowerCase()===nm);p=c.find(x=>!x.conn)||c[0];if(p)p.token=token}
  if(p){p.conn=true;this.commit();return {id:p.id}}
  if(G.phase!=="lobby")return {err:"This game has already started. To get back in, join again with exactly the same name you used before."};
  if(G.players.length>=12)return {err:"The castle is full (12 players)."};
  name=String(name||"").trim().slice(0,16)||"Guest";
  let base=name,k=2;while(G.players.some(x=>x.name.toLowerCase()===name.toLowerCase()))name=base+" "+(k++);
  p={id:"p"+(G.nid++),name,token,gold:8,inv:{S:0,D:0},conn:true};G.players.push(p);this.commit();return {id:p.id};
 },
 setConn(id,c){const p=this.P(id);if(p&&p.conn!==c){p.conn=c;this.commit()}},

/* ---------- armoury mini games ---------- */
