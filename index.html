<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revise — GCSE</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0a0e1a; --bg2:#0f1525; --surface:#161d31; --surface2:#1c2440;
  --line:#283251; --line2:#384469;
  --ink:#eef2fb; --muted:#aeb9d6; --faint:#8b97ba;
  --accent:#7c83ff; --accent2:#22d3ee; --violet:#a855f7;
  --gold:#f7c948; --green:#34d399; --red:#fb7185;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:
  radial-gradient(1200px 600px at 80% -10%, rgba(124,131,255,.12), transparent 60%),
  radial-gradient(1000px 500px at -10% 10%, rgba(34,211,238,.08), transparent 55%),
  var(--bg);
  color:var(--ink);line-height:1.5;min-height:100vh;-webkit-text-size-adjust:100%}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  background:rgba(10,14,26,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 16px}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand .dot{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.tb-right{display:flex;align-items:center;gap:10px}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.chip.gold{color:var(--gold)}
.chip .lvlnum{background:linear-gradient(135deg,var(--accent),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
main{max-width:820px;margin:0 auto;padding:18px 16px 90px}
h1{font-size:26px;margin:2px 0 2px;letter-spacing:-.2px}
h2{font-size:19px;margin:0}
.sub{color:var(--muted);margin:0 0 16px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
button{font-family:inherit;color:inherit}
/* hero */
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(180deg,var(--surface),var(--bg2));
  border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}
.hero .rings{display:flex;gap:14px}
.ringwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.ringwrap small{font-size:11px;color:var(--muted);font-weight:600}
.ring-text{fill:var(--ink);font-size:15px;font-weight:800}
.ring-sub{fill:var(--muted);font-size:8px;font-weight:600}
.hero-main{flex:1;min-width:0}
.hero-main .lvline{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.badge-lvl{font-weight:800;font-size:14px;background:linear-gradient(135deg,var(--accent),var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.xpbar{height:9px;background:#0c1222;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.xpbar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd97a)}
.cta{display:block;width:100%;border:0;border-radius:16px;padding:17px;margin:6px 0 4px;cursor:pointer;
  font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6);
  box-shadow:0 8px 24px -8px rgba(124,131,255,.6)}
.cta:active{transform:translateY(1px)}
.cta.lg{font-size:18px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin:14px 0}
.subject-card{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);
  border-radius:16px;padding:14px;cursor:pointer;overflow:hidden;transition:border-color .15s,transform .05s}
.subject-card:hover{border-color:var(--line2)} .subject-card:active{transform:translateY(1px)}
.subject-card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c,var(--accent))}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.subject-name{font-weight:700;font-size:15px}
.sc-lvl{font-size:11px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);
  border-radius:6px;padding:2px 7px;white-space:nowrap}
.subject-meta{color:var(--muted);font-size:12px;margin:8px 0 8px}
.bar{height:7px;background:#0c1222;border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--c,var(--accent))}
.bar.small{height:5px}
.duepill{display:inline-block;margin-top:9px;font-size:11px;font-weight:800;border-radius:99px;padding:2px 9px;
  color:var(--accent2);background:rgba(34,211,238,.12)}
.duepill.done{color:var(--green);background:rgba(52,211,153,.12)}
.row{display:flex;gap:10px;align-items:center}
.row.two>*{flex:1}.row.wrap{flex-wrap:wrap}
.tile-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:8px}
.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:13px;
  padding:13px 14px;font-size:14px;font-weight:700;cursor:pointer}
.ghost:hover{border-color:var(--line2)}
.ghost.danger{color:var(--red);border-color:rgba(251,113,133,.35)}
.back{background:none;border:0;color:var(--accent);font-weight:700;font-size:14px;padding:6px 0;cursor:pointer;margin-bottom:6px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px}
.page-head .ph-l{display:flex;align-items:center;gap:11px;min-width:0}
.ph-swatch{width:6px;height:34px;border-radius:6px;background:var(--c,var(--accent));flex-shrink:0}
.head-actions{display:flex;gap:6px;flex-shrink:0}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;
  padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer}
.mini:hover{color:var(--ink);border-color:var(--line2)}
.mini.danger{color:var(--red);border-color:rgba(251,113,133,.3)}
.mini.on{color:var(--gold);border-color:rgba(247,201,72,.5);background:rgba(247,201,72,.1)}
.list,.cards{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.topic-row{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;border:1px solid var(--line);
  background:var(--surface);border-radius:14px;padding:14px;cursor:pointer}
.topic-row:hover{border-color:var(--line2)}
.topic-main{flex:1;min-width:0}
.topic-name{font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.lvl-tag{font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px;text-transform:uppercase;letter-spacing:.04em}
.lvl-tag.needs{color:#fda4af;background:rgba(251,113,133,.14)}
.lvl-tag.developing{color:#fcd34d;background:rgba(247,201,72,.14)}
.lvl-tag.secure{color:#6ee7b7;background:rgba(52,211,153,.14)}
.lvl-tag.tricky{color:#fbbf24;background:rgba(251,191,36,.16)}
.topic-side{display:flex;align-items:center;gap:8px;flex-shrink:0}
.count{font-size:12px;color:var(--faint)}
.section-label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:20px 0 9px;font-weight:700}
.card-row{border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:12px}
.card-q{font-weight:600;font-size:14px}
.card-meta{color:var(--faint);font-size:12px;margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
.card-tools{display:flex;gap:6px;margin-top:9px}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.notes p{margin:0 0 10px}.notes ul{margin:0 0 10px;padding-left:20px}.notes li{margin:4px 0}
.notes strong{color:#fff}
.notes-edit{width:100%;min-height:320px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);
  border-radius:12px;padding:12px;font-family:inherit;font-size:15px;line-height:1.6}
.tip{color:var(--faint);font-size:13px;margin-top:16px}
.empty{color:var(--faint);font-style:italic;padding:8px 0}
.linklist{display:flex;flex-direction:column;gap:8px}
.linklist a{display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-weight:600;font-size:14px}
.linklist a:hover{border-color:var(--line2)} .linklist a .arr{color:var(--accent);font-weight:800}
/* question / session */
.q-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.q-progress{flex:1;height:8px;background:#0c1222;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.q-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
.q-count{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.combo{text-align:center;height:20px;font-weight:800;font-size:13px;color:var(--gold);margin-bottom:6px;
  transition:opacity .2s}
.q-tag{font-size:12px;font-weight:700;color:var(--c,var(--accent));margin-bottom:9px;text-transform:uppercase;letter-spacing:.04em}
.q-card{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:18px;
  padding:24px 20px;margin-bottom:14px;box-shadow:0 10px 30px -16px rgba(0,0,0,.7)}
.q-text{font-size:21px;font-weight:600;line-height:1.4}
.q-assess-flag{display:inline-block;font-size:11px;font-weight:800;color:var(--accent2);
  background:rgba(34,211,238,.12);border-radius:99px;padding:3px 10px;margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);border-radius:13px;padding:15px;font-size:16px;font-weight:600;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--line2)}
.opt .key{width:26px;height:26px;flex-shrink:0;border-radius:7px;background:var(--surface2);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--muted)}
.opt.correct{border-color:var(--green);background:rgba(52,211,153,.13)}
.opt.correct .key{background:var(--green);color:#06281d;border-color:var(--green)}
.opt.wrong{border-color:var(--red);background:rgba(251,113,133,.12)}
.opt.wrong .key{background:var(--red);color:#3a0c14;border-color:var(--red)}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
.ansrow{display:flex;gap:10px}
.ansrow input{flex:1;background:var(--bg2);color:var(--ink);border:1px solid var(--line2);border-radius:13px;
  padding:15px;font-size:17px;font-family:inherit}
.ansrow input:focus{outline:none;border-color:var(--accent)}
.btn{border:0;border-radius:13px;padding:15px 20px;font-size:16px;font-weight:800;cursor:pointer;
  color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.feedback{margin-top:14px;border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.feedback.ok{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.4)}
.feedback.no{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.4)}
.fb-head{font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:5px}
.feedback.ok .fb-head{color:var(--green)} .feedback.no .fb-head{color:var(--red)}
.fb-xp{margin-left:auto;color:var(--gold);font-size:13px}
.fb-correct{font-size:14px;margin:4px 0} .fb-ex{font-size:13px;color:var(--muted);margin-top:6px}
.nextbtn{display:block;width:100%;margin-top:12px;border:0;border-radius:13px;padding:15px;font-size:16px;font-weight:800;
  cursor:pointer;color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
/* summary */
.summary{text-align:center;padding-top:14px}
.scorering{margin:8px auto 4px}
.score-line{display:flex;justify-content:center;gap:22px;margin:14px 0}
.score-line>div{display:flex;flex-direction:column}.score-line b{font-size:26px}.score-line span{font-size:12px;color:var(--muted)}
.levelup{background:linear-gradient(135deg,rgba(124,131,255,.18),rgba(168,85,247,.14));border:1px solid var(--line2);
  border-radius:14px;padding:14px;margin:12px 0;font-weight:800}
/* achievements */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:6px}
.ach{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:center}
.ach.locked{opacity:.45;filter:grayscale(.6)}
.ach .ic{font-size:28px}.ach .an{font-weight:800;font-size:13px;margin-top:6px}.ach .ad{font-size:11px;color:var(--muted);margin-top:3px}
/* stats / progress */
.stat-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.stat-card b{display:block;font-size:26px}.stat-card span{font-size:12px;color:var(--muted)}
.stat-row{display:flex;align-items:center;gap:10px;margin:9px 0}
.stat-name{width:130px;font-size:13px;font-weight:700;flex-shrink:0}
.stat-row .bar{flex:1}.stat-num{width:52px;text-align:right;font-size:12px;color:var(--muted)}
.weeks{display:flex;align-items:flex-end;gap:6px;height:90px;margin:10px 0;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.weeks .wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.weeks .wk i{display:block;width:100%;max-width:30px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:5px 5px 0 0;min-height:3px}
.weeks .wk small{font-size:10px;color:var(--faint)}
.lockmsg{font-size:12px;color:var(--faint);background:var(--surface);border:1px dashed var(--line2);border-radius:12px;padding:11px 13px;margin:8px 0}
.setting{margin:14px 0}.setting label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--muted)}
.setting input{flex:1;background:var(--bg2);color:var(--ink);border:1px solid var(--line2);border-radius:11px;padding:12px;font-size:15px;font-family:inherit}
/* toasts */
#toasts{position:fixed;left:0;right:0;bottom:18px;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--surface2);border:1px solid var(--line2);border-radius:13px;padding:11px 16px;font-weight:800;font-size:14px;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.7);display:flex;align-items:center;gap:9px;animation:pop .3s ease}
.toast.xp{color:var(--gold)} .toast.ach{color:var(--accent2)} .toast.lvl{color:var(--violet)}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(max-width:520px){ .hero{flex-direction:column;align-items:stretch} .hero .rings{justify-content:center} h1{font-size:23px} }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand" data-act="home"><span class="dot"></span> Revise</div>
  <div class="tb-right">
    <span class="chip"><span class="lvlnum">Lv <b id="tbLevel">1</b></span></span>
    <span class="chip gold">⚡ <b id="tbXp">0</b></span>
    <span class="chip">🔥 <b id="tbStreak">0</b></span>
  </div>
</header>
<main id="app"></main>
<div id="toasts"></div>
<input type="file" id="fileInput" accept="application/json,.json" style="display:none">

<script>
"use strict";

/* ===== date helpers ===== */
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtD(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function addDays(s,n){var p=s.split("-").map(Number);var dt=new Date(p[0],p[1]-1,p[2]);dt.setDate(dt.getDate()+n);return fmtD(dt);}
function mondayOf(s){var p=s.split("-").map(Number);var dt=new Date(p[0],p[1]-1,p[2]);var k=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-k);return fmtD(dt);}

/* ===== misc ===== */
var _u=0; function uid(){_u++;return "id"+Date.now().toString(36)+_u.toString(36);}
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pct(p,t){return t?Math.round(p/t*100):0;}
function fmtMins(ms){var m=Math.round(ms/60000);if(m<60)return m+"m";return Math.floor(m/60)+"h "+(m%60)+"m";}
function fmt(text){
  var e=esc(text).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  var lines=e.split("\n"),out="",ul=false;
  for(var i=0;i<lines.length;i++){var ln=lines[i];
    if(/^\s*-\s+/.test(ln)){if(!ul){out+="<ul>";ul=true;}out+="<li>"+ln.replace(/^\s*-\s+/,"")+"</li>";}
    else{if(ul){out+="</ul>";ul=false;}if(ln.trim()!=="")out+="<p>"+ln+"</p>";}}
  if(ul)out+="</ul>";return out;
}
function ringSVG(p,size,sw,color,big,small){
  var r=(size-sw)/2,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(100,p))/100);
  var h='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">';
  h+='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke="rgba(255,255,255,.07)" stroke-width="'+sw+'" fill="none"/>';
  h+='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke="'+color+'" stroke-width="'+sw+'" fill="none" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>';
  if(big)h+='<text x="50%" y="'+(small?"44%":"50%")+'" text-anchor="middle" dy="0.35em" class="ring-text">'+big+'</text>';
  if(small)h+='<text x="50%" y="66%" text-anchor="middle" class="ring-sub">'+small+'</text>';
  h+='</svg>';return h;
}

/* ===== short-answer marking ===== */
function normAns(s){return String(s==null?"":s).toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9À-ÿ ]+/g," ").replace(/\s+/g," ").trim().replace(/^(the|a|an) /,"");}
function lev(a,b){var m=a.length,n=b.length;if(!m)return n;if(!n)return m;var d=[];for(var i=0;i<=m;i++)d[i]=[i];for(var j=0;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){var c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);}return d[m][n];}
function shortOK(q,input){var u=normAns(input);if(!u)return false;var acc=q.accept||[];
  for(var i=0;i<acc.length;i++){var n=normAns(acc[i]);if(!n)continue;if(u===n)return true;var tol=n.length>=8?2:(n.length>=5?1:0);if(tol&&lev(u,n)<=tol)return true;}return false;}
function markAnswer(q,input){
  if(q.type==="mcq")return input===q.answer;
  if(q.type==="numeric"){var v=parseFloat(String(input).replace(/[, ]/g,""));if(isNaN(v))return false;return Math.abs(v-q.answer)<=(q.tolerance||0)+1e-9;}
  return shortOK(q,input);
}
function correctText(q){
  if(q.type==="mcq")return q.options[q.answer];
  if(q.type==="numeric")return q.answer+(q.tolerance?" (±"+q.tolerance+")":"");
  return (q.accept&&q.accept[0])||"";
}

/* ===== spaced repetition ===== */
var INTERVALS=[0,1,2,4,9,18,40];
function scheduleQ(q,correct,tricky){
  var t=todayStr();q.reps=(q.reps||0)+1;q.attempts=(q.attempts||0)+1;q.last=t;
  if(correct){q.correct=(q.correct||0)+1;q.box=Math.min(6,(q.box||0)+1);var d=INTERVALS[q.box];if(tricky)d=Math.min(d,5);q.due=addDays(t,Math.max(1,d));}
  else{q.box=1;q.lapses=(q.lapses||0)+1;q.due=addDays(t,1);}
}
function isDue(q){return (q.due||"0000-00-00")<=todayStr();}
function isMastered(q){return (q.box||0)>=5;}

/* ===== XP / levels ===== */
function cumXp(L){return 100*(L-1)*L/2;}
function levelInfo(){var xp=DB.game.xp||0,L=1;while(cumXp(L+1)<=xp)L++;var base=cumXp(L),next=cumXp(L+1);return {level:L,into:xp-base,span:next-base,pct:pct(xp-base,next-base),next:next-xp};}
function addXp(n){DB.game.xp=(DB.game.xp||0)+n;ensureDay(todayStr()).xp=(ensureDay(todayStr()).xp||0)+n;}

/* ===== achievements ===== */
var ACH=[
  {id:"first",ic:"🎯",name:"First Steps",desc:"Answer your first question",test:function(c){return DB.game.totalAns>=1;}},
  {id:"q100",ic:"💯",name:"Centurion",desc:"Answer 100 questions",test:function(c){return DB.game.totalAns>=100;}},
  {id:"q500",ic:"📚",name:"Bookworm",desc:"Answer 500 questions",test:function(c){return DB.game.totalAns>=500;}},
  {id:"streak3",ic:"🔥",name:"On a Roll",desc:"3-day revision streak",test:function(c){return (DB.settings.streak||0)>=3;}},
  {id:"streak7",ic:"⚡",name:"Week Warrior",desc:"7-day revision streak",test:function(c){return (DB.settings.streak||0)>=7;}},
  {id:"streak30",ic:"👑",name:"Unstoppable",desc:"30-day revision streak",test:function(c){return (DB.settings.streak||0)>=30;}},
  {id:"combo10",ic:"🎲",name:"Hot Streak",desc:"10 correct in a row",test:function(c){return (c.combo||0)>=10;}},
  {id:"combo25",ic:"🌟",name:"Flawless",desc:"25 correct in a row",test:function(c){return (c.combo||0)>=25;}},
  {id:"ace",ic:"🧠",name:"Ace",desc:"100% on a topic assessment",test:function(c){return c.assessPct===100;}},
  {id:"lvl5",ic:"🥈",name:"Level 5",desc:"Reach level 5",test:function(c){return levelInfo().level>=5;}},
  {id:"lvl10",ic:"🥇",name:"Level 10",desc:"Reach level 10",test:function(c){return levelInfo().level>=10;}},
  {id:"master",ic:"🏆",name:"Subject Master",desc:"Master a whole subject",test:function(c){return DB.subjects.some(function(s){var qs=subjQs(s);return qs.length>0&&qs.every(isMastered);});}}
];
function checkAch(ctx){ctx=ctx||{};var got=[];
  for(var i=0;i<ACH.length;i++){var a=ACH[i];if(!DB.game.ach[a.id]&&a.test(ctx)){DB.game.ach[a.id]=todayStr();got.push(a);}}
  got.forEach(function(a){toast("ach","🏅 Achievement: "+a.name);});
  return got;
}

/* ===== state ===== */
var KEY="gcse-revision-v2";
var PALETTE=["#7c83ff","#22d3ee","#f59e0b","#a855f7","#fb7185","#34d399","#f472b6","#38bdf8","#fb923c","#c084fc"];
var DB=null,view={name:"home"},session=null,ui={editingNotes:false};
var app=document.getElementById("app");

function ensureDay(t){if(!DB.log.days[t])DB.log.days[t]={ms:0,answered:0,correct:0,xp:0,subjects:{}};return DB.log.days[t];}
function logStudy(sid,ms,correct){var d=ensureDay(todayStr());d.ms+=ms;d.answered++;if(correct)d.correct++;
  var s=d.subjects[sid]||(d.subjects[sid]={ms:0,answered:0,correct:0});s.ms+=ms;s.answered++;if(correct)s.correct++;
  DB.game.totalAns=(DB.game.totalAns||0)+1;if(correct)DB.game.totalCorrect=(DB.game.totalCorrect||0)+1;}

function normalize(){
  if(!DB.settings)DB.settings={};
  if(DB.settings.dailyGoal==null)DB.settings.dailyGoal=20;
  if(DB.settings.streak==null)DB.settings.streak=0;
  if(DB.settings.studentName==null)DB.settings.studentName="";
  if(!DB.game)DB.game={};
  if(DB.game.xp==null)DB.game.xp=0;if(!DB.game.ach)DB.game.ach={};
  if(DB.game.totalAns==null)DB.game.totalAns=0;if(DB.game.totalCorrect==null)DB.game.totalCorrect=0;
  if(!DB.log)DB.log={days:{}};if(!DB.log.days)DB.log.days={};
  if(!Array.isArray(DB.subjects))DB.subjects=[];
  DB.subjects.forEach(function(s){if(!s.color)s.color=PALETTE[0];if(!s.pastPapers)s.pastPapers=[];s.topics=s.topics||[];
    s.topics.forEach(function(tp){if(tp.learn==null)tp.learn="";if(tp.tricky==null)tp.tricky=false;if(tp.assessed==null)tp.assessed=false;if(tp.level==null)tp.level=null;
      tp.questions=tp.questions||[];tp.questions.forEach(function(q){if(q.box==null)q.box=0;if(!q.due)q.due=todayStr();if(q.reps==null)q.reps=0;if(q.attempts==null)q.attempts=0;if(q.correct==null)q.correct=0;if(q.lapses==null)q.lapses=0;});});});
}
var CONTENT_VERSION=1;
function hashId(prefix,str){var h=0x811c9dc5>>>0;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return prefix+h.toString(36);}
function assignStableIds(data){data.subjects.forEach(function(s){s.id=hashId("s_",s.name);s.topics.forEach(function(t){t.id=hashId("t_",s.name+"/"+t.name);t.questions.forEach(function(q){q.id=hashId("q_",s.name+"/"+t.name+"/"+q.q);});});});}
function mergeContent(saved,fresh){var added=0;var sBy={};saved.subjects.forEach(function(s){sBy[s.id]=s;});
  fresh.subjects.forEach(function(fs){var ss=sBy[fs.id];
    if(!ss){saved.subjects.push(fs);fs.topics.forEach(function(t){added+=t.questions.length;});return;}
    ss.name=fs.name;ss.color=fs.color;ss.pastPapers=fs.pastPapers;
    var tBy={};ss.topics.forEach(function(t){tBy[t.id]=t;});
    fs.topics.forEach(function(ft){var st=tBy[ft.id];
      if(!st){ss.topics.push(ft);added+=ft.questions.length;return;}
      st.name=ft.name;st.learn=ft.learn;
      var qBy={};st.questions.forEach(function(q){qBy[q.id]=q;});
      ft.questions.forEach(function(fq){var sq=qBy[fq.id];
        if(!sq){st.questions.push(fq);added++;return;}
        sq.type=fq.type;sq.q=fq.q;sq.options=fq.options;sq.answer=fq.answer;sq.accept=fq.accept;sq.tolerance=fq.tolerance;sq.explain=fq.explain;});});});
  return added;}
function load(){var fresh=seedData();assignStableIds(fresh);
  try{var raw=localStorage.getItem(KEY);if(raw){DB=JSON.parse(raw);normalize();var added=mergeContent(DB,fresh);normalize();DB.contentVersion=CONTENT_VERSION;save();if(added>0)setTimeout(function(){toast("ach","📚 "+added+" new questions added");},800);return;}}catch(e){}
  DB=fresh;DB.contentVersion=CONTENT_VERSION;save();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){console.warn(e);}}

/* ===== counting ===== */
function subjQs(s){var a=[];s.topics.forEach(function(t){a=a.concat(t.questions);});return a;}
function subjDue(s){return subjQs(s).filter(isDue).length;}
function subjMastered(s){return subjQs(s).filter(isMastered).length;}
function subjAccuracy(s){var qs=subjQs(s),at=0,co=0;qs.forEach(function(q){at+=q.attempts||0;co+=q.correct||0;});return at?Math.round(co/at*100):null;}
function topicDue(t){return t.questions.filter(isDue).length;}
function topicMastered(t){return t.questions.filter(isMastered).length;}
function allRefs(f){var o=[];DB.subjects.forEach(function(s){s.topics.forEach(function(t){t.questions.forEach(function(q){if(!f||f(q,s,t))o.push({sid:s.id,tid:t.id,qid:q.id});});});});return o;}
function getRef(r){var s=DB.subjects.find(function(x){return x.id===r.sid;});if(!s)return null;var t=s.topics.find(function(x){return x.id===r.tid;});if(!t)return null;var q=t.questions.find(function(x){return x.id===r.qid;});if(!q)return null;return {subject:s,topic:t,q:q};}

/* ===== navigation ===== */
function go(name,sid,tid){view={name:name,sid:sid,tid:tid};ui.editingNotes=false;render();window.scrollTo(0,0);}
function render(){
  var li=levelInfo();
  document.getElementById("tbLevel").textContent=li.level;
  document.getElementById("tbXp").textContent=DB.game.xp||0;
  document.getElementById("tbStreak").textContent=DB.settings.streak||0;
  var v=view.name;
  if(v==="subject")renderSubject();else if(v==="topic")renderTopic();else if(v==="learn")renderLearn();
  else if(v==="papers")renderPapers();else if(v==="session")renderSession();else if(v==="achievements")renderAch();
  else if(v==="progress")renderProgress();else if(v==="backup")renderBackup();else renderHome();
}

/* ===== SESSION (assessment + practice) ===== */
function beginSession(refs,opts){
  opts=opts||{};
  if(!refs||!refs.length){toast("xp","No questions here yet — add some first");return;}
  session={queue:refs,i:0,mode:opts.mode||"practice",title:opts.title||"Revision",sid:opts.sid,tid:opts.tid,
    combo:0,bestCombo:0,stats:{answered:0,correct:0},cur:null,shownTs:Date.now(),leveledTo:null};
  go("session");
}
function reviewToday(){var refs=allRefs(isDue);var goal=DB.settings.dailyGoal||20;shuffle(refs);if(refs.length>goal)refs=refs.slice(0,goal);if(!refs.length){refs=allRefs();shuffle(refs);refs=refs.slice(0,goal);}beginSession(refs,{title:"Daily revision"});}
function reviewSubject(sid){var s=DB.subjects.find(function(x){return x.id===sid;});if(!s)return;var refs=allRefs(function(q,ss){return ss.id===sid&&isDue(q);});if(!refs.length)refs=allRefs(function(q,ss){return ss.id===sid;});shuffle(refs);beginSession(refs,{title:s.name,sid:sid});}
function testTopic(sid,tid){var s=DB.subjects.find(function(x){return x.id===sid;});if(!s)return;var t=s.topics.find(function(x){return x.id===tid;});if(!t)return;
  if(!t.assessed){return assessTopic(sid,tid);}
  var refs=t.questions.filter(isDue).map(function(q){return {sid:sid,tid:tid,qid:q.id};});
  if(!refs.length)refs=t.questions.map(function(q){return {sid:sid,tid:tid,qid:q.id};});
  shuffle(refs);beginSession(refs,{title:t.name,sid:sid,tid:tid});}
function assessTopic(sid,tid){var s=DB.subjects.find(function(x){return x.id===sid;});var t=s.topics.find(function(x){return x.id===tid;});
  var refs=t.questions.map(function(q){return {sid:sid,tid:tid,qid:q.id};});shuffle(refs);refs=refs.slice(0,Math.min(8,refs.length));
  if(!refs.length){toast("xp","Add some questions first");return;}
  beginSession(refs,{title:t.name,sid:sid,tid:tid,mode:"assessment"});}

function curQ(){if(!session)return null;var r=session.queue[session.i];return r?getRef(r):null;}

function submitAnswer(input){
  if(!session||session.cur)return;
  var f=curQ();if(!f){session.i++;render();return;}
  var ok=markAnswer(f.q,input);
  var tricky=f.topic.tricky;
  if(session.mode==="practice")scheduleQ(f.q,ok,tricky);
  else{f.q.attempts=(f.q.attempts||0)+1;if(ok)f.q.correct=(f.q.correct||0)+1;}
  var ms=Math.min(Date.now()-session.shownTs,90000);
  logStudy(f.subject.id,ms,ok);
  session.stats.answered++;
  var xp=0;
  if(ok){session.stats.correct++;session.combo++;if(session.combo>session.bestCombo)session.bestCombo=session.combo;
    xp=10+Math.min(10,Math.max(0,session.combo-1)*2);addXp(xp);}
  else{session.combo=0;}
  session.cur={picked:input,ok:ok,xp:xp};
  markStudied();
  var before=levelInfo().level;
  // (xp already added) detect level change
  var after=levelInfo().level;if(after>before)session.leveledTo=after;
  var newly=checkAch({combo:session.combo});
  save();render();
}
function nextQuestion(){
  if(!session)return;session.i++;session.cur=null;session.shownTs=Date.now();
  if(session.i>=session.queue.length)finishSession();
  render();
}
function finishSession(){
  if(session.finished)return;session.finished=true;
  if(session.mode==="assessment"&&session.tid){
    var s=DB.subjects.find(function(x){return x.id===session.sid;});var t=s&&s.topics.find(function(x){return x.id===session.tid;});
    if(t){var p=pct(session.stats.correct,session.stats.answered);t.assessed=true;t.level=p<45?"needs":(p<75?"developing":"secure");
      // set initial due dates across the whole topic based on level
      var push=t.level==="secure"?12:(t.level==="developing"?2:0);var k=0;
      t.questions.forEach(function(q){if(!q.attempts){q.due=addDays(todayStr(),push+(k%3));k++;}});
      session.assessPct=p;checkAch({assessPct:p});}
  }
  checkAch({});save();
}
function renderSession(){
  if(!session){go("home");return;}
  if(session.i>=session.queue.length){return renderSummary();}
  var f=curQ();if(!f){session.i++;render();return;}
  var q=f.q,n=session.queue.length,pos=session.i+1,answered=!!session.cur;
  var comboTxt=(!answered&&session.combo>=3)?("🔥 "+session.combo+" in a row!"):"";
  var h='<div class="q-top"><button class="back" data-act="end-session">✕ End</button>'
    +'<div class="q-progress"><span style="width:'+pct(answered?pos:pos-1,n)+'%"></span></div>'
    +'<div class="q-count">'+pos+'/'+n+'</div></div>'
    +'<div class="combo">'+comboTxt+'</div>'
    +'<div class="q-tag" style="--c:'+f.subject.color+'">'+esc(f.subject.name)+' · '+esc(f.topic.name)+'</div>'
    +'<div class="q-card">'+(session.mode==="assessment"?'<span class="q-assess-flag">Assessment</span><br>':'')
    +'<div class="q-text">'+esc(q.q).replace(/\n/g,"<br>")+'</div></div>';
  // input area
  if(q.type==="mcq"){
    h+='<div class="opts">';
    q.options.forEach(function(opt,idx){
      var cls="opt";
      if(answered){var picked=session.cur.picked===idx;if(idx===q.answer)cls+=" correct";else if(picked)cls+=" wrong";else cls+=" dim";}
      h+='<button class="'+cls+'" '+(answered?"disabled":'data-act="ans-mcq" data-idx="'+idx+'"')+'>'
        +'<span class="key">'+(idx+1)+'</span><span>'+esc(opt)+'</span></button>';
    });
    h+='</div>';
  } else {
    h+='<div class="ansrow"><input id="ansInput" type="'+(q.type==="numeric"?"number":"text")+'" inputmode="'+(q.type==="numeric"?"decimal":"text")+'" placeholder="Type your answer" '+(answered?"disabled":"")+' autocomplete="off">'
      +(answered?'':'<button class="btn" data-act="ans-text">Check</button>')+'</div>';
  }
  // feedback
  if(answered){
    var ok=session.cur.ok;
    h+='<div class="feedback '+(ok?"ok":"no")+'"><div class="fb-head">'+(ok?"✓ Correct":"✗ Not quite")+(session.cur.xp?'<span class="fb-xp">+'+session.cur.xp+' XP</span>':'')+'</div>';
    if(!ok)h+='<div class="fb-correct">Answer: <b>'+esc(correctText(q))+'</b></div>';
    if(q.explain)h+='<div class="fb-ex">'+esc(q.explain)+'</div>';
    h+='</div><button class="nextbtn" data-act="next-q">'+(pos>=n?"Finish":"Next →")+'</button>';
  }
  app.innerHTML=h;
  if(!answered&&q.type!=="mcq"){var inp=document.getElementById("ansInput");if(inp)inp.focus();}
}
function renderSummary(){
  var st=session.stats,acc=pct(st.correct,st.answered),lvl=session.leveledTo;
  var dayXp=(DB.log.days[todayStr()]||{}).xp||0;
  var h='<section class="summary"><div class="scorering">'+ringSVG(acc,120,11,acc>=75?"#34d399":acc>=45?"#f7c948":"#fb7185",acc+"%","SCORE")+'</div>'
    +'<h1>'+(session.mode==="assessment"?"Assessment done":"Session complete")+'</h1><p class="sub">'+esc(session.title)+'</p>';
  if(session.mode==="assessment"&&session.tid){var s=DB.subjects.find(function(x){return x.id===session.sid;});var t=s&&s.topics.find(function(x){return x.id===session.tid;});
    if(t)h+='<div class="levelup">Level set: <b style="text-transform:capitalize">'+(t.level==="needs"?"Needs work":t.level)+'</b> — '+(t.level==="needs"?"we\'ll teach this thoroughly and test it often.":t.level==="developing"?"some gaps to firm up.":"solid — we\'ll keep it ticking over lightly.")+'</div>';}

    +'<div><b>'+session.bestCombo+'</b><span>best streak</span></div>'

function addSubject(){var n=prompt("New subject name:");if(!n||!n.trim())return;DB.subjects.push({id:uid(),name:n.trim(),color:PALETTE[DB.subjects.length%PALETTE.length],pastPapers:[{label:"AQA past papers (find your subject)",url:"https://www.aqa.org.uk/find-past-papers-and-mark-schemes"}],topics:[]});save();render();}
function renameSubject(sid){var s=DB.subjects.find(function(x){return x.id===sid;});if(!s)return;var n=prompt("Rename subject:",s.name);if(n&&n.trim()){s.name=n.trim();save();render();}}
function delSubject(sid){var s=DB.subjects.find(function(x){return x.id===sid;});if(!s)return;if(confirm('Delete "'+s.name+'" and everything in it?')){DB.subjects=DB.subjects.filter(function(x){return x.id!==sid;});save();go("home");}}
function addTopic(sid){var s=DB.subjects.find(function(x){return x.id===sid;});if(!s)return;var n=prompt("New topic name:");if(!n||!n.trim())return;s.topics.push({id:uid(),name:n.trim(),learn:"",tricky:false,assessed:false,level:null,questions:[]});save();render();}
function delTopic(sid,tid){var s=DB.subjects.find(function(x){return x.id===sid;});var t=s&&s.topics.find(function(x){return x.id===tid;});if(!t)return;if(confirm('Delete topic "'+t.name+'"?')){s.topics=s.topics.filter(function(x){return x.id!==tid;});save();go("subject",sid);}}
function toggleTricky(sid,tid){var s=DB.subjects.find(function(x){return x.id===sid;});var t=s&&s.topics.find(function(x){return x.id===tid;});if(!t)return;t.tricky=!t.tricky;if(t.tricky)toast("ach","★ Flagged tricky — you'll see this more often");save();render();}
function addQuestion(sid,tid){var s=DB.subjects.find(function(x){return x.id===sid;});var t=s&&s.topics.find(function(x){return x.id===tid;});if(!t)return;
  var q=prompt("Question:");if(!q||!q.trim())return;var a=prompt("Answer (the correct one):");if(a==null||!a.trim())return;
  var w=prompt("Wrong options for multiple choice, separated by commas (leave blank for a typed-answer question):");
  var nq;
  if(w&&w.trim()){var opts=[a.trim()].concat(w.split(",").map(function(x){return x.trim();}).filter(Boolean));var ans=0;
    // shuffle but track answer
    var pairs=opts.map(function(o,i){return {o:o,c:i===0};});shuffle(pairs);ans=pairs.findIndex(function(p){return p.c;});
    nq=mkQ("mcq",{q:q.trim(),options:pairs.map(function(p){return p.o;}),answer:ans,explain:""});}
  else nq=mkQ("short",{q:q.trim(),accept:[a.trim()],explain:""});
  t.questions.push(nq);t.assessed=false;save();render();}
function delQuestion(sid,tid,qid){var s=DB.subjects.find(function(x){return x.id===sid;});var t=s&&s.topics.find(function(x){return x.id===tid;});if(!t)return;if(confirm("Remove this question?")){t.questions=t.questions.filter(function(x){return x.id!==qid;});save();render();}}

/* ===== question constructors ===== */
function mkQ(type,o){return {id:uid(),type:type,q:o.q,options:o.options,answer:o.answer,accept:o.accept,tolerance:o.tolerance,explain:o.explain||"",box:0,due:todayStr(),reps:0,attempts:0,correct:0,lapses:0};}
function MCQ(q,opts,ans,ex){return mkQ("mcq",{q:q,options:opts,answer:ans,explain:ex});}
function TF(q,ans,ex){return mkQ("mcq",{q:q,options:["True","False"],answer:ans?0:1,explain:ex});}
function SA(q,accept,ex){return mkQ("short",{q:q,accept:accept,explain:ex});}
function NUM(q,ans,tol,ex){return mkQ("numeric",{q:q,answer:ans,tolerance:tol||0,explain:ex});}
