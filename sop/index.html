<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ricoman R&D — Product Pipeline</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<link rel="apple-touch-icon" href="../icon-192.png">
<style>
:root{
  --bg:#0a0e1a; --bg2:#0f1525; --surface:#161d31; --surface2:#1c2440;
  --line:#283251; --line2:#384469;
  --ink:#eef2fb; --muted:#aeb9d6; --faint:#8b97ba;
  --accent:#7c83ff; --accent2:#22d3ee; --violet:#a855f7;
  --gold:#f7c948; --green:#34d399; --red:#fb7185; --amber:#fbbf24;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:
  radial-gradient(1200px 600px at 80% -10%, rgba(124,131,255,.12), transparent 60%),
  radial-gradient(1000px 500px at -10% 10%, rgba(34,211,238,.08), transparent 55%),
  var(--bg);
  color:var(--ink);line-height:1.5;min-height:100vh;-webkit-text-size-adjust:100%}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  background:rgba(10,14,26,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 16px}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;cursor:pointer;display:flex;align-items:center;gap:9px}
.brand .dot{width:11px;height:11px;border-radius:3px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--faint);letter-spacing:.4px;text-transform:uppercase}
.tb-right{display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer}
.chip:hover{border-color:var(--line2)}
.chip .who{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:880px;margin:0 auto;padding:18px 16px 96px}
h1{font-size:25px;margin:2px 0 2px;letter-spacing:-.2px}
h2{font-size:19px;margin:0}
.sub{color:var(--muted);margin:0 0 16px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
button{font-family:inherit;color:inherit}
a{color:var(--accent2)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 16px}
.stat{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.stat .n{font-size:23px;font-weight:800;letter-spacing:-.5px}
.stat .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.stat.a .n{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat.g .n{color:var(--green)} .stat.gold .n{color:var(--gold)}

.search{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:13px;
  padding:13px 14px;font-size:15px;margin-bottom:10px}
.search::placeholder{color:var(--faint)}

/* project cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin:12px 0}
.card{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);
  border-radius:16px;padding:15px;overflow:hidden;transition:border-color .15s,transform .05s}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--line2)} .card.click:active{transform:translateY(1px)}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c,var(--accent))}
.c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.code{font-size:11px;font-weight:800;color:var(--c,var(--accent));letter-spacing:.5px}
.pill{font-size:10px;font-weight:800;color:var(--faint);background:var(--surface2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.title{font-weight:700;font-size:16px;margin:6px 0 4px}
.stagebadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--c,var(--accent)) 18%,transparent);
  border-radius:999px;padding:4px 10px;margin-top:4px}
.meta{color:var(--faint);font-size:12px;margin-top:10px;display:flex;gap:12px;flex-wrap:wrap}
.meta b{color:var(--muted);font-weight:700}
.prog{height:8px;background:#0c1222;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:11px}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
.prog.done span{background:linear-gradient(90deg,var(--green),#6ee7b7)}

.cta{display:block;width:100%;border:0;border-radius:15px;padding:16px;margin:6px 0 4px;cursor:pointer;
  font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6);
  box-shadow:0 8px 24px -8px rgba(124,131,255,.6)}
.cta:active{transform:translateY(1px)}
.cta.green{background:linear-gradient(135deg,#10b981,#34d399);box-shadow:0 8px 24px -8px rgba(52,211,153,.55)}
.cta:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:10px;align-items:center}
.row.two>*{flex:1}.row.wrap{flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:13px;
  padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer}
.ghost:hover{border-color:var(--line2)}
.ghost.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.ghost.danger{color:var(--red);border-color:rgba(251,113,133,.35)}
.ghost.accent{color:var(--accent2);border-color:rgba(34,211,238,.35)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font-size:14px;font-weight:700;cursor:pointer;padding:4px 0;margin-bottom:6px}
.back:hover{color:var(--ink)}

label.fld{display:block;margin:12px 0 0}
label.fld .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;display:block}
input.in,textarea.in,select.in{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:11px;padding:11px 12px;font-size:15px;font-family:inherit}
textarea.in{resize:vertical;min-height:64px}
input.in:focus,textarea.in:focus,select.in:focus{outline:none;border-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.panel h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint)}
.divider{height:1px;background:var(--line);margin:14px 0}
.tiny{font-size:12px;color:var(--faint)}

/* pipeline stages */
.stage{border:1px solid var(--line);background:var(--surface);border-radius:16px;margin:10px 0;overflow:hidden}
.stage.passed{border-color:rgba(52,211,153,.4)}
.stage.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.stage.locked{opacity:.62}
.st-head{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.st-dot{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;border:2px solid var(--line2);color:var(--muted);background:var(--bg2)}
.stage.passed .st-dot{background:var(--green);border-color:var(--green);color:#04240f}
.stage.current .st-dot{background:linear-gradient(135deg,var(--accent),var(--violet));border-color:transparent;color:#fff}
.st-h-body{flex:1;min-width:0}
.st-h-title{font-weight:700;font-size:15px}
.st-h-sub{font-size:12px;color:var(--faint);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.party{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;
  color:var(--p,var(--accent));background:color-mix(in srgb,var(--p,var(--accent)) 16%,transparent)}
.st-state{flex:0 0 auto;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.st-state.passed{color:var(--green)} .st-state.current{color:var(--accent)} .st-state.locked{color:var(--faint)}
.st-body{padding:0 14px 14px}

.task{display:flex;gap:11px;align-items:flex-start;border-top:1px solid var(--line);padding:11px 2px}
.task:first-child{border-top:0}
.task.click{cursor:pointer}
.box{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:transparent;margin-top:1px;transition:all .12s}
.task.done .box{background:var(--green);border-color:var(--green);color:#04240f}
.tk-body{flex:1;min-width:0}
.tk-text{font-size:14px}
.task.done .tk-text{color:var(--muted)}
.tk-stamp{font-size:11px;color:var(--green);font-weight:700;margin-top:3px}

.signs{margin-top:12px;border-top:1px dashed var(--line2);padding-top:12px}
.signrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.sr-role{flex:1;min-width:0;font-size:14px;font-weight:700}
.sr-meta{font-size:12px;color:var(--green);font-weight:700}
.sr-meta.pending{color:var(--faint)}

.gatebar{margin-top:12px;border-radius:12px;padding:11px 13px;font-weight:700;font-size:13px}
.gatebar.open{background:rgba(124,131,255,.12);border:1px solid rgba(124,131,255,.4);color:var(--ink)}
.gatebar.passed{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);color:var(--green)}
.gatebar.locked{background:var(--bg2);border:1px solid var(--line);color:var(--faint)}

.empty{text-align:center;color:var(--faint);padding:40px 16px}
.empty .big{font-size:40px;margin-bottom:8px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(10,14,26,.92);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;background:none;border:0;color:var(--faint);font-size:11px;font-weight:700;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0}
.tab .ti{font-size:19px;line-height:1}
.tab.on{color:var(--accent)}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(4,7,15,.6);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:540px;background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}
@media(min-width:560px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin-bottom:4px}
.tmpl{border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:12px;margin-top:8px;cursor:pointer;text-align:left;width:100%}
.tmpl:hover{border-color:var(--line2)} .tmpl.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}

.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:60;background:var(--surface2);
  border:1px solid var(--line2);color:var(--ink);font-weight:700;font-size:14px;padding:11px 16px;border-radius:12px;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.6);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

.actrow{display:flex;gap:11px;border-left:2px solid var(--line2);padding:0 0 14px 14px;position:relative}
.actrow::before{content:"";position:absolute;left:-5px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.act-t{font-size:14px;font-weight:600}
.act-m{font-size:12px;color:var(--faint);margin-top:1px}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand" onclick="go('projects')">
    <span class="dot"></span>
    <span>Ricoman R&amp;D<small>Product Pipeline</small></span>
  </div>
  <div class="tb-right">
    <button class="chip" onclick="openOperator()" title="Set who is signed in">
      <span>👤</span><span class="who" id="whoChip">Set name</span>
    </button>
  </div>
</div>

<main id="app"></main>

<nav class="tabbar">
  <button class="tab" data-tab="projects" onclick="go('projects')"><span class="ti">🚀</span>Projects</button>
  <button class="tab" data-tab="activity" onclick="go('activity')"><span class="ti">📜</span>Activity</button>
  <button class="tab" data-tab="new" onclick="newProject()"><span class="ti">➕</span>New</button>
  <button class="tab" data-tab="more" onclick="go('more')"><span class="ti">⚙️</span>More</button>
</nav>

<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Ricoman R&D — Product Pipeline
   Stage-gate project management for new product / component
   development: idea → launch, with checked steps, multi-party
   sign-off gates, and an activity log. Single-file PWA, data
   stored locally per device (use More → Backup to export).
   ============================================================ */

var LS = {
  projects:'rdnpd.projects.v1', templates:'rdnpd.templates.v1',
  settings:'rdnpd.settings.v1', activity:'rdnpd.activity.v1'
};
function load(k,f){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* parties (responsible groups) and their colours */
var PARTIES = ['R&D','Testing','China Factory','UK Production','Marketing','Commercial','MD'];
var PARTY_COLOR = {
  'R&D':'#7c83ff','Testing':'#a855f7','China Factory':'#fb7185','UK Production':'#22d3ee',
  'Marketing':'#f7c948','Commercial':'#34d399','MD':'#fbbf24'
};
function partyColor(p){ return PARTY_COLOR[p] || '#8b97ba'; }

/* ---- default stage-gate templates (fully editable) ---- */
function seedTemplates(){
  return [
    { id:uid(), name:'New Product', type:'Product', stages:[
      { name:'Idea & Concept', party:'R&D', signRoles:['R&D Lead'], tasks:[
        'Capture the product idea and intended use','Identify the market need and target customer',
        'Outline rough feasibility and ballpark cost','Check for similar existing products / IP'] },
      { name:'Specification', party:'R&D', signRoles:['R&D Lead','Commercial'], tasks:[
        'Define functional requirements and specification','Set target cost, price and margin',
        'Draft outline bill of materials (BOM)','Define key standards / compliance needs'] },
      { name:'Design', party:'R&D', signRoles:['R&D Lead','Engineering'], tasks:[
        'Produce CAD models and drawings','Hold internal design review','Release drawings & BOM at revision A'] },
      { name:'Prototype', party:'R&D', signRoles:['R&D Engineer'], tasks:[
        'Build first prototype','Internal functional check','Record build notes and photos'] },
      { name:'Testing', party:'Testing', signRoles:['QA Lead'], tasks:[
        'Internal R&D test against specification','Independent / second-party test',
        'Third-party or field test','Compile test report and resolve issues'] },
      { name:'China Factory Clarification', party:'China Factory', signRoles:['R&D Lead','Factory Contact'], tasks:[
        'Send drawings, BOM and samples to factory','Clarify tooling, materials and process',
        'Factory confirms feasibility and pricing','Approve factory pre-production sample'] },
      { name:'UK Production Setup', party:'UK Production', signRoles:['Production Manager','QA Lead'], tasks:[
        'Define UK production / assembly process','Approve first article inspection',
        'Agree QC plan and acceptance criteria'] },
      { name:'Marketing Handover', party:'Marketing', signRoles:['Marketing','Commercial'], tasks:[
        'Prepare product information pack','Supply images, copy and specifications',
        'Confirm pricing and launch date','Marketing sign-off to proceed'] },
      { name:'Launch', party:'Commercial', signRoles:['R&D Lead','Commercial','MD'], tasks:[
        'Final go / no-go review','Release to sales channels','Product launched'] }
    ]},
    { id:uid(), name:'New Component', type:'Component', stages:[
      { name:'Idea & Need', party:'R&D', signRoles:['R&D Lead'], tasks:[
        'Capture the component need','Define where it will be used','Outline target cost'] },
      { name:'Specification', party:'R&D', signRoles:['R&D Lead'], tasks:[
        'Define component spec and tolerances','Identify standards / compliance','Draft datasheet requirements'] },
      { name:'Sourcing & China Clarification', party:'China Factory', signRoles:['R&D Lead','Factory Contact'], tasks:[
        'Send spec / drawings to factory or supplier','Clarify materials and process',
        'Obtain quotation and lead time','Request samples'] },
      { name:'Sample & Test', party:'Testing', signRoles:['QA Lead'], tasks:[
        'Inspect samples to specification','Functional / fit test','Test by an independent party','Compile result'] },
      { name:'UK Production Approval', party:'UK Production', signRoles:['Production Manager','QA Lead'], tasks:[
        'Confirm fit within production','First article approval','Agree incoming QC check'] },
      { name:'Approval & Release', party:'Commercial', signRoles:['R&D Lead','Commercial'], tasks:[
        'Final approval','Add to approved component list','Notify production & purchasing'] }
    ]}
  ];
}

/* ---- state ---- */
var state = {
  projects: load(LS.projects, []),
  templates: load(LS.templates, null),
  settings: load(LS.settings, { operator:'' }),
  activity: load(LS.activity, []),
  view:'projects', query:'', current:null, openStage:null,
  editing:null, newSel:null
};
if(!state.templates){ state.templates = seedTemplates(); save(LS.templates, state.templates); }

function persist(){ save(LS.projects,state.projects); save(LS.templates,state.templates);
  save(LS.settings,state.settings); save(LS.activity,state.activity); }
function findProject(id){ return state.projects.filter(function(p){return p.id===id;})[0]; }

/* ---- pipeline logic ---- */
function stagePassed(st){
  var tasksOk = st.tasks.length ? st.tasks.every(function(t){return t.done;}) : true;
  var signsOk = (st.signRoles||[]).every(function(r){
    return (st.signoffs||[]).some(function(s){ return s.role===r; }); });
  return tasksOk && signsOk;
}
function currentIndex(p){
  for(var i=0;i<p.stages.length;i++){ if(!stagePassed(p.stages[i])) return i; }
  return p.stages.length; // all passed = complete
}
function projectPct(p){
  var n=p.stages.length; if(!n) return 0;
  var passed=0, partial=0, ci=currentIndex(p);
  for(var i=0;i<n;i++){ if(stagePassed(p.stages[i])) passed++; }
  if(ci<n){ var st=p.stages[ci]; var done=st.tasks.filter(function(t){return t.done;}).length;
    var tot=st.tasks.length + (st.signRoles?st.signRoles.length:0);
    var sg=(st.signoffs||[]).length; partial = tot? (done+sg)/tot : 0; }
  return Math.round((passed+partial)/n*100);
}
function isComplete(p){ return currentIndex(p)>=p.stages.length; }

/* ---- activity ---- */
function logAct(p, type, detail){
  state.activity.unshift({ id:uid(), ts:Date.now(), code:p.code, name:p.name,
    type:type, detail:detail, by:state.settings.operator||'' });
  if(state.activity.length>500) state.activity.length=500;
}
/* run a mutation then log any gate(s) crossed */
function withGateLog(p, fn){
  var before=currentIndex(p);
  fn();
  var after=currentIndex(p);
  for(var i=before;i<after && i<p.stages.length;i++){
    logAct(p,'gate','Gate passed: '+p.stages[i].name);
  }
  if(before<p.stages.length && after>=p.stages.length){ logAct(p,'launch','🎉 '+p.name+' completed — launched'); }
  persist();
}

/* ---- toast / nav ---- */
var toastTimer;
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove('show');},2200); }
function go(v){ state.view=v; closeModal(); render(); window.scrollTo(0,0); }
function setTabs(){
  var map={projects:'projects',activity:'activity',more:'more',project:'projects',editor:'more',tmplEdit:'more'};
  var a=map[state.view]||'projects';
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('on', t.getAttribute('data-tab')===a); });
}

/* ============================================================ RENDER */
function render(){
  var el=document.getElementById('app');
  if(state.view==='projects')      el.innerHTML=viewProjects();
  else if(state.view==='project')  el.innerHTML=viewProject();
  else if(state.view==='activity') el.innerHTML=viewActivity();
  else if(state.view==='more')     el.innerHTML=viewMore();
  else if(state.view==='tmplEdit') el.innerHTML=viewTmplEdit();
  setTabs(); updateWhoChip();
}
function updateWhoChip(){ document.getElementById('whoChip').textContent=state.settings.operator||'Set name'; }

/* ---- Projects home ---- */
function viewProjects(){
  var active=state.projects.filter(function(p){return !p.archived;});
  var live=active.filter(function(p){return !isComplete(p);}).length;
  var done=state.projects.filter(function(p){return isComplete(p);}).length;
  var q=state.query.toLowerCase();
  var list=active.filter(function(p){
    return !q || (p.name+' '+p.code+' '+p.type).toLowerCase().indexOf(q)>=0;
  }).sort(function(a,b){ return b.created-a.created; });

  if(!state.projects.length){
    return '<h1>Product Pipeline</h1><p class="sub">Manage new products & components from idea to launch.</p>'+
      '<div class="empty"><div class="big">🚀</div>No projects yet.<br><span class="tiny">Tap <b>New</b> to start your first product or component.</span></div>'+
      '<button class="cta" onclick="newProject()">+ Start a project</button>';
  }
  var cards=list.map(function(p){
    var ci=currentIndex(p), comp=isComplete(p);
    var st=comp?null:p.stages[ci];
    var col=comp?'#34d399':partyColor(st?st.party:'R&D');
    var pct=projectPct(p);
    return '<div class="card click" style="--c:'+col+'" onclick="openProject(\''+p.id+'\')">'+
      '<div class="c-top"><span class="code">'+esc(p.code)+'</span><span class="pill">'+esc(p.type)+'</span></div>'+

      '<div class="prog'+(comp?' done':'')+'"><span style="width:'+pct+'%"></span></div>'+
      '<div class="meta"><span><b>'+pct+'%</b> complete</span>'+

  }).join('');

  return '<h1>Product Pipeline</h1><p class="sub">From idea to launch — follow every gated step.</p>'+
    '<div class="stats">'+
      '<div class="stat a"><div class="n">'+live+'</div><div class="l">In progress</div></div>'+

}
function onSearch(v){ state.query=v; render(); var i=document.querySelector('.search'); if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);} }

/* ---- Project detail (the pipeline) ---- */
function openProject(id){ state.current=id; var p=findProject(id);
  state.openStage = p ? (p.stages[currentIndex(p)]||p.stages[p.stages.length-1]||{}).name : null; go('project'); }

function viewProject(){
  var p=findProject(state.current);
  if(!p) return '<div class="empty">Project not found.</div>';
  var ci=currentIndex(p), comp=isComplete(p), pct=projectPct(p);

  var stages=p.stages.map(function(st,i){
    var passed=i<ci, current=i===ci, locked=i>ci;
    var cls=passed?'passed':current?'current':'locked';
    var open = (st.name===state.openStage) || current;
    var tasksDone=st.tasks.filter(function(t){return t.done;}).length;
    var signsDone=(st.signoffs||[]).length, signsReq=(st.signRoles||[]).length;
    var col=partyColor(st.party);

    var head='<div class="st-head" onclick="toggleStage('+i+')">'+
      '<div class="st-dot">'+(passed?'✓':locked?'🔒':(i+1))+'</div>'+
      '<div class="st-h-body"><div class="st-h-title">'+esc(st.name)+'</div>'+
        '<div class="st-h-sub"><span class="party" style="--p:'+col+'">'+esc(st.party)+'</span>'+
          '<span>'+tasksDone+'/'+st.tasks.length+' steps</span>'+
          (signsReq?'<span>'+signsDone+'/'+signsReq+' sign-off</span>':'')+'</div></div>'+
      '<div class="st-state '+cls+'">'+(passed?'Passed':current?'Active':'Locked')+'</div>'+
    '</div>';

    if(!open) return '<div class="stage '+cls+'">'+head+'</div>';

    var editable=current; // only the active stage can be changed
    var tasks=st.tasks.map(function(t,ti){
      return '<div class="task'+(t.done?' done':'')+(editable?' click':'')+'" '+(editable?'onclick="toggleTask('+i+','+ti+')"':'')+'>'+
        '<div class="box">✓</div><div class="tk-body"><div class="tk-text">'+esc(t.text)+'</div>'+
        (t.done?'<div class="tk-stamp">✓ '+esc(t.by||'done')+' · '+fmtDateTime(t.at)+'</div>':'')+'</div></div>';
    }).join('');

    var signs = signsReq ? '<div class="signs"><h3 style="margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint)">Gate sign-off</h3>'+
      st.signRoles.map(function(role){
        var so=(st.signoffs||[]).filter(function(s){return s.role===role;})[0];
        return '<div class="signrow"><div class="sr-role">'+esc(role)+'</div>'+
          (so?'<span class="sr-meta">✓ '+esc(so.name)+' · '+fmtDate(so.at)+'</span>'+
              (editable?' <button class="ghost sm" onclick="unsign('+i+',\''+esc(role).replace(/'/g,"\\'")+'\')">undo</button>':'')
            :(editable?'<button class="ghost sm accent" onclick="sign('+i+',\''+esc(role).replace(/'/g,"\\'")+'\')">Sign</button>':'<span class="sr-meta pending">pending</span>'))+
        '</div>';
      }).join('')+'</div>' : '';

    var gate = passed ? '<div class="gatebar passed">✓ Gate passed</div>'
      : current ? (stagePassed(st)?'<div class="gatebar passed">✓ Gate passed — next stage unlocked</div>'
                                  :'<div class="gatebar open">Complete all steps & sign-offs to pass this gate.</div>')
      : '<div class="gatebar locked">🔒 Unlocks when the previous gate passes.</div>';

    var addTask = editable ? '<button class="ghost sm" style="margin-top:10px" onclick="addTask('+i+')">+ Add step</button>' : '';

    return '<div class="stage '+cls+'">'+head+'<div class="st-body">'+tasks+addTask+signs+gate+'</div></div>';
  }).join('');

  return '<button class="back" onclick="go(\'projects\')">‹ Projects</button>'+
    '<div class="c-top"><span class="code">'+esc(p.code)+'</span><span class="pill">'+esc(p.type)+'</span></div>'+
    '<h1>'+esc(p.name)+'</h1>'+
    '<p class="sub">'+(p.owner?'Owner: <b>'+esc(p.owner)+'</b> · ':'')+
      (comp?'<b style="color:var(--green)">Launched 🎉</b>':'Stage '+(ci+1)+' of '+p.stages.length)+
      (p.targetLaunch?' · Target launch: <b>'+esc(p.targetLaunch)+'</b>':'')+'</p>'+
    '<div class="prog'+(comp?' done':'')+'" style="margin:0 0 4px"><span style="width:'+pct+'%"></span></div>'+
    '<p class="tiny" style="margin:0 0 12px">'+pct+'% complete</p>'+
    stages+
    '<div class="divider"></div>'+
    '<div class="row two"><button class="ghost" onclick="editProject(\''+p.id+'\')">Edit details</button>'+
      '<button class="ghost '+(p.archived?'accent':'danger')+'" onclick="toggleArchive(\''+p.id+'\')">'+(p.archived?'Unarchive':'Archive')+'</button></div>';
}
function toggleStage(i){ var p=findProject(state.current); var n=p.stages[i].name;
  state.openStage = (state.openStage===n)?null:n; render(); }

function toggleTask(si,ti){
  var p=findProject(state.current); var st=p.stages[si];
  if(si!==currentIndex(p)) return;
  withGateLog(p, function(){
    var t=st.tasks[ti];
    if(t.done){ t.done=false; t.at=null; t.by=null; }
    else { t.done=true; t.at=Date.now(); t.by=state.settings.operator||'—'; }
  });
  render();
}
function addTask(si){
  var p=findProject(state.current); if(si!==currentIndex(p)) return;
  var v=prompt('New step for this stage:'); if(!v||!v.trim()) return;
  p.stages[si].tasks.push({text:v.trim(),done:false,at:null,by:null});
  persist(); render();
}
function sign(si,role){
  var p=findProject(state.current); if(si!==currentIndex(p)) return;
  if(!state.settings.operator){ openOperator(true); return; }
  withGateLog(p, function(){
    p.stages[si].signoffs=p.stages[si].signoffs||[];
    p.stages[si].signoffs.push({role:role,name:state.settings.operator,at:Date.now()});
    logAct(p,'signoff',role+' signed off "'+p.stages[si].name+'"');
  });
  toast(role+' signed by '+state.settings.operator);
  render();
}
function unsign(si,role){
  var p=findProject(state.current); if(si!==currentIndex(p)) return;
  p.stages[si].signoffs=(p.stages[si].signoffs||[]).filter(function(s){return s.role!==role;});
  persist(); render();
}
function toggleArchive(id){ var p=findProject(id); p.archived=!p.archived; persist();
  toast(p.archived?'Archived':'Unarchived'); go('projects'); }

/* ---- export / import ---- */
function download(name,text,type){
  var blob=new Blob([text],{type:type||'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},100);
}
function exportJSON(){
  download('ricoman-pipeline-'+dateStamp()+'.json',
    JSON.stringify({exported:Date.now(),projects:state.projects,templates:state.templates,activity:state.activity,settings:state.settings},null,2));
  toast('Exported');
}
function importJSON(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=function(){ var f=inp.files[0]; if(!f)return; var rd=new FileReader();
    rd.onload=function(){ try{ var d=JSON.parse(rd.result);
      if(!confirm('Replace current data with the imported file?'))return;
      if(d.projects)state.projects=d.projects; if(d.templates)state.templates=d.templates;
      if(d.activity)state.activity=d.activity; if(d.settings)state.settings=d.settings;
      persist(); toast('Imported'); go('projects');
    }catch(e){ toast('Could not read that file'); } };
    rd.readAsText(f); };
  inp.click();
}
function exportCSV(){
  if(!state.activity.length){ toast('Nothing to export'); return; }
  var rows=[['When','Type','Detail','Project code','Project','By']];
  state.activity.forEach(function(a){ rows.push([fmtDateTime(a.ts),a.type,a.detail,a.code,a.name,a.by||'']); });
  var csv=rows.map(function(r){return r.map(function(c){ c=String(c==null?'':c);
    return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(',');}).join('\n');
  download('ricoman-activity-'+dateStamp()+'.csv',csv,'text/csv'); toast('CSV exported');
}

/* ---- time helpers ---- */
function pad(n){ return n<10?'0'+n:''+n; }
function fmtDate(ts){ var d=new Date(ts); return d.getDate()+' '+mon(d)+' '+d.getFullYear(); }
function fmtDateTime(ts){ var d=new Date(ts); return d.getDate()+' '+mon(d)+' '+d.getFullYear()+', '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function mon(d){ return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]; }
function dateStamp(){ var d=new Date(); return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()); }

/* ---- boot ---- */
render();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
