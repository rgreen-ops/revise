      <line x1="140" y1="300" x2="760" y2="300" stroke-dasharray="4 6" stroke-width="1"/>
    </g>
    <path d="M140 380 L240 350 L330 365 L420 300 L510 315 L600 240 L690 255 L760 180" stroke="#f59e0b" stroke-width="4" fill="none"/>
    <g fill="#f59e0b"><circle cx="420" cy="300" r="6"/><circle cx="600" cy="240" r="6"/><circle cx="760" cy="180" r="6"/></g>
    <text x="160" y="150" fill="rgba(255,255,255,0.28)" font-family="monospace" font-size="14">GBP/TONNE · LME</text>
