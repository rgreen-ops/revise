  </defs>
  <rect width="880" height="560" fill="url(#bg)"/>
  <rect width="880" height="560" fill="url(#grid)"/>
  <rect width="880" height="560" fill="url(#glow)"/>
  
    <g stroke="rgba(255,255,255,0.28)" stroke-width="2" fill="none">
      <line x1="140" y1="120" x2="140" y2="420"/><line x1="140" y1="420" x2="760" y2="420"/>
