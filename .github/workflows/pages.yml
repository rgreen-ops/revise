name: Publish site (Bim Builder + theme demos)

# One site, two things on it:
#   /            -> the Bim Builder app (unchanged URLs)
#   /demos/      -> theme demo hub + all twelve theme demos
# Also packages the sellable theme zips and uploads them as a run
# artifact ("theme-zips") — download from the run's Summary page.
on:
  push:
    branches: ["main", "claude/niche-themes-marketplace-n9qm1r"]
    paths:
      - "bim-builder/**"
      - "themes/**"
      - "marketing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write # release uploads
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # NB: no `environment:` block — the auto-created github-pages
    # environment restricts deploys to main, which would reject runs
    # from the feature branch before any step executes. deploy-pages
    # still records its deployment against the Pages environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (bim-builder at root, demos under /demos)
        run: |
          ./marketing/build-demos.sh
          mkdir -p _site/demos
          cp -r bim-builder/. _site/
          cp -r marketing/demo-site/. _site/demos/

      - name: Package theme zips
        run: ./marketing/package-zips.sh

      - name: Upload theme zips artifact
        uses: actions/upload-artifact@v4
        with:
          name: theme-zips
          path: marketing/dist/*.zip
          retention-days: 90

      # Publish the zips to a rolling release so each product has a
      # stable, one-click download URL:
      # https://github.com/<owner>/<repo>/releases/download/themes-latest/<file>
      - name: Publish theme zips to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: themes-latest
          name: Theme product zips (latest)
          body: >
            Sellable theme packages, rebuilt automatically on every push.
            Upload these zips to your marketplace listings.
          files: marketing/dist/*.zip

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
